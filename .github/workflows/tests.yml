name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (versions the golden fixtures were recorded with)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.4.4 scipy==1.17.1 scikit-learn==1.8.0 pandas==3.0.2 \
                      datasets matplotlib seaborn pytest
      - name: Run tests
        run: pytest tests -q
